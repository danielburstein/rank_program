name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libegl1 libxkbcommon0
      - run: pip install -e ".[all]"
      - run: ruff check rankrecovery tests scripts
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
